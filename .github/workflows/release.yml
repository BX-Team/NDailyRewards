name: Publish Release

# Ships to three places from one build: the Maven repository (the `api` module),
# the GitHub release, and Modrinth + Hangar. They all take the same jar, so
# unlike the other repositories there is no draft-release hand-off — one job
# builds it and publishes it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 3.5.0)
        required: true
        type: string
      description:
        description: "Optional summary for the top of the release notes. Use \\n for a line break."
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark as a pre-release, and publish to Modrinth/Hangar as a beta
        default: false
        type: boolean
      draft:
        description: Publish the GitHub release as a draft and skip Modrinth/Hangar
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the version and find the previous tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          } >> "$GITHUB_OUTPUT"

  # The same build build.yml runs, copied here rather than called: a release
  # must not be the first place the checks run.
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up the JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

  tag:
    name: Tag the release
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The grep is there because a sed that matched nothing is how a release
      # ships the previous version.
      - name: Set the version in gradle.properties
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          sed -i 's/^version=.*/version='"$VERSION"'/' gradle.properties
          grep -qx "version=$VERSION" gradle.properties

      - name: Commit the bump and push the tag
        id: push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m "chore(release): bump version to $VERSION"
          git tag -a "$TAG" -m "$VERSION"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the release
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release jar
        run: ./gradlew build --stacktrace

      - name: Verify the release jar
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          ls -la build/libs
          if [ ! -f "build/libs/NDailyRewards-$VERSION.jar" ]; then
            echo "::error::build/libs/NDailyRewards-$VERSION.jar was not produced"
            exit 1
          fi

      # Not fatal: the Maven repository being down should not cost the release.
      # A failed publish is re-runnable on its own afterwards.
      - name: Publish the API to the Maven repository
        continue-on-error: true
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_SECRET }}
        run: ./gradlew api:publish

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: .github/changelog_configuration.json
          mode: COMMIT
          fromTag: ${{ needs.prepare.outputs.previous }}
          toTag: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With a description the generated sections are demoted a level and sit
      # under it; without one they stay the top-level outline. Only the category
      # titles start a line with '## ' — commit lines start with '- ' — so the sed
      # cannot reach into a commit message.
      - name: Compose the release body
        env:
          DESCRIPTION: ${{ inputs.description }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        shell: bash
        run: |
          if [ -n "$(printf '%s' "$DESCRIPTION" | tr -d '[:space:]')" ]; then
            {
              echo '## 📑 Changelog'
              echo
              # %b so a '\n' typed into the dispatch field becomes a real line
              # break — GitHub renders that input as a single-line box.
              printf '%b\n' "$DESCRIPTION"
              echo
              printf '%s\n' "$CHANGELOG" | sed 's/^## /### /'
            } >body.md
          else
            printf '%s\n' "$CHANGELOG" >body.md
          fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NDailyRewards ${{ needs.prepare.outputs.version }}
          body_path: body.md
          files: build/libs/NDailyRewards-${{ needs.prepare.outputs.version }}.jar
          fail_on_unmatched_files: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to a branch rather than a tag: `@hangar` is the fork branch that
      # carries Hangar support, and there is no released tag with it.
      - name: Publish to Modrinth and Hangar
        if: ${{ ! inputs.draft }}
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: ZiFzQAnz
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          modrinth-unfeature-mode: any

          hangar-id: BX-Team/NDailyRewards
          hangar-token: ${{ secrets.HANGAR_TOKEN }}

          files: build/libs/NDailyRewards-${{ needs.prepare.outputs.version }}.jar

          name: NDailyRewards ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}
          version-type: ${{ inputs.prerelease && 'beta' || 'release' }}
          changelog: ${{ steps.changelog.outputs.changelog }}

          loaders: |
            paper
            purpur
            folia
            spigot
          game-versions: |
            1.16
            1.16.1
            1.16.2
            1.16.3
            1.16.4
            1.16.5
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
          java: 17

      - name: Write the result to the run summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          {
            echo "## [$TAG]($URL)"
            echo
            echo '| Target | Status |'
            echo '| --- | --- |'
            echo "| GitHub release | \`NDailyRewards-$VERSION.jar\` |"
            echo "| Maven (\`api\`) | published |"
            if [ "$DRAFT" = 'true' ]; then
              echo '| Modrinth / Hangar | skipped — draft |'
            else
              echo "| Modrinth / Hangar | NDailyRewards $VERSION |"
            fi
            echo
            cat body.md
          } >> "$GITHUB_STEP_SUMMARY"
