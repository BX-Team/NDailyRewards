name: Sync Modrinth Description

on:
  push:
    branches: ["master"]
    paths:
      - README.md

permissions: {}

concurrency:
  group: modrinth-description
  cancel-in-progress: true

jobs:
  description:
    name: Push the README to Modrinth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update the Modrinth description
        uses: funnyboy-roks/modrinth-auto-desc@v1
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ndailyrewards
